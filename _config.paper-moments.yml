shuoshuo:
  author_label: 克喵Moretti
  source_label: 查看原文
  comment_label: 评论这条
  loading_label: 正在收集最新的便签……
  empty_label: 还没有公开说说
  error_label: 暂时无法加载说说，请稍后重试
  retry_label: 重新加载

comments:
  enable: true
  provider: twikoo
  twikoo_version: 1.7.15
  path: /shuoshuo/
  unconfigured_label: 评论区尚未配置，填入 Twikoo 环境地址后即可使用。
  quote_hint: 引用已准备好，可以继续编辑后发布。

# 独立留言板：与 /shuoshuo/ 的评论使用不同 Twikoo path，不会混在同一线程。
comment_board:
  enable: true
  path: /comment/
  eyebrow: GUESTBOOK / 留言板
  title: 留一页话给我
  description: 想说的话，都会被好好收进这本手账。
  letter_title: "✨来自站点作者的留言:"
  letter_lines:
    - 本站有哪些做得好或者不好的地方？
    - 或者你有什么改进的建议？
    - 又或者你有什么具体的问题需要咨询？
    - 都可以在下方评论区留言哦~~~
  letter_footer: 小站站长亲自为您服务！
  envelope:
    # 对应 AIOVTUE 留言板的桌面默认尺寸；可按站点实际字体微调。
    wrap_height: 447
    open_height: 1050
    open_offset: -200
    danmaku_open_bottom_trim: 140
  open_label: 打开这封便签
  close_label: 收起这封便签
  toggle_label: 切换便签展开状态
  comments_title: 写下你的话
  comments_kicker: MESSAGE BOOK / 留言簿
  danmaku:
    # 仅展示 /comment/ 线程中已公开的留言及回复；不展示 HTML、链接或图片。
    enable: true
    desktop_only: true
    page_size: 50
    include_replies: true
    max_text_length: 42
    lane_count: 4
    min_speed: 54
    max_speed: 82
    gap: 22
    interval_ms: 760
    pause_label: 暂停弹幕
    resume_label: 继续弹幕
    reduced_motion_label: 已按系统设置减少动态效果
    offline_label: 离线时不播放留言弹幕。
    empty_label: 还没有可飘过的留言，等你的第一句。
    unavailable_label: 留言弹幕暂时无法加载。

reactions:
  # 每条说说使用 shuoshuo:<post.id> 作为独立 target。
  enable: true
  endpoint: https://api-emaction.081531.xyz
  storage_key: paper-moments-reactions
  available:
    - emoji: 👍
      name: thumbs-up
      label: 赞
    - emoji: ❤️
      name: red-heart
      label: 喜欢
    - emoji: 😄
      name: smile-face
      label: 开心
    - emoji: 🎉
      name: party-popper
      label: 庆祝
    - emoji: 👀
      name: eyes
      label: 看过
  # GET /reactions?targetId=...
  get_path: /reactions
  # PATCH /reaction?targetId=...&reaction_name=...&diff=...
  toggle_path: /reaction

appearance:
  default_mode: system
  theme_storage_key: paper-moments-theme
  accent_hue: 136
  accent_storage_key: paper-moments-accent

pjax:
  enable: true
  # 需要排除的链接（href 精确匹配，例如 /special/）；外链/锚点/mailto/下载已默认排除。
  exclude: []

# PWA 离线适配：SWPP 生成 /sw.js，静态资源按规则缓存；
# HTML 不缓存，远程数据（说说/友链/赞助）在线加载；评论区等接口短时缓存。
pwa:
  enable: true
  manifest: /manifest.json
  theme_color: '#6f9274'
  background_color: '#f4efe4'
  apple_touch_icon: /icons/icon-180.png
  icon_192: /icons/icon-192.png
  icon_512: /icons/icon-512.png
  icon_maskable_512: /icons/icon-maskable-512.png

# 首页 Live Dashboard 实时状态面板（自部署 live-dashboard，通过接口渲染）。
# url: 面板页面地址（用于外链与推导 api_base）。
# api_base: 接口根路径，留空则自动使用 "${url%/}/api"。
# refresh_interval: 自动刷新间隔（毫秒），默认 10000。
# max_activities: 展示的最近活动条数，默认 5。
live_dashboard:
  enable: true
  url: https://live.081531.xyz/
  api_base:
  refresh_interval: 10000
  max_activities: 5
  show_activities: true
  show_viewers: true
  eyebrow: LIVE / 实时状态
  title: 正在做什么
  description: 一块实时状态面板，看看我在做什么。
  open_label: 在新窗口查看完整版
  error_label: 实时状态暂时无法加载。
  retry_label: 重新加载
  loading_label: 正在连接实时面板…

# 左下角音乐播放器（参考 wxuyu.top 左侧导航栏形态）。
# 歌曲的 url/cover/lrc 可为本地路径（放在 source/music/ 下，写 /music/<file>）或远程 URL。
music:
  enable: true
  # 文案（迷你条/歌词面板/可访问性）
  title_label: 正在播放
  play_label: 播放
  pause_label: 暂停
  prev_label: 上一首
  next_label: 下一首
  lyrics_label: 歌词
  volume_label: 音量
  close_label: 收起播放器
  open_label: 打开音乐播放器
  empty_label: 暂无歌曲
  no_lyrics_label: 暂无歌词
  # 播放列表：按顺序播放，播完自动下一首；最后一首播完回到第一首。
  playlist:
    - title: 我寄此书
      artist: 丁丁Rajar
      url: https://cdn.jsdmirror.cn/gh/kmoretti/music@main/music/1.mp3
      cover: https://cdn.jsdmirror.cn/gh/kmoretti/music@main/cover/1.jpg
      lrc: https://jsd.268682.xyz/gh/kmoretti/music@main/lrc/1.lrc
